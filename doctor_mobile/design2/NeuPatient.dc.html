<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    a { color: #6D75A8; } a:hover { color: #4E5586; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #E9E7F0; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 22px 18px 0; display: flex; align-items: center; gap: 14px;">
    <div style="width: 28px; height: 28px; border-radius: 999px; background: #E9E7F0; box-shadow: 3px 3px 6px rgba(163,157,194,0.3), -3px -3px 6px rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A5F92" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
    <span style="font-size: 17px; font-weight: 700; color: #40415E;">Patient snapshot</span>
  </div>

  <div style="flex: 1; padding: 20px 18px 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">

    <div style="padding: 17px; border-radius: 24px; background: #E9E7F0; box-shadow: 6px 6px 14px rgba(163,157,194,0.32), -6px -6px 14px rgba(255,255,255,0.85); display: flex; align-items: center; gap: 14px;">
      <div style="width: 54px; height: 54px; border-radius: 999px; background: #E9E7F0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 5px 5px 11px rgba(163,157,194,0.4), -4px -4px 9px rgba(255,255,255,0.85);">
        <span style="color: #5A5F92; font-weight: 700; font-size: 17px;">MI</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 19px; font-weight: 700; color: #40415E; letter-spacing: -0.2px;">Meera Iyer</span>
        <div style="display: flex; gap: 7px;">
          <div style="padding: 4px 10px; border-radius: 999px; background: #E9E7F0; box-shadow: inset 2px 2px 4px rgba(163,157,194,0.3), inset -2px -2px 4px rgba(255,255,255,0.8);"><span style="font-size: 10.5px; font-weight: 700; color: #6E6F8C;">34F</span></div>
          <div style="padding: 4px 10px; border-radius: 999px; background: #E9E7F0; box-shadow: inset 2px 2px 4px rgba(163,157,194,0.3), inset -2px -2px 4px rgba(255,255,255,0.8);"><span style="font-size: 10.5px; font-weight: 700; color: #A2537C;">O+</span></div>
        </div>
      </div>
    </div>

    <div style="background: #E9E7F0; border-radius: 22px; padding: 15px; box-shadow: 6px 6px 13px rgba(163,157,194,0.3), -6px -6px 13px rgba(255,255,255,0.85); display: flex; flex-direction: column; gap: 7px;">
      <span style="font-size: 10px; color: #ADADC0; font-weight: 700; letter-spacing: 0.4px;">TODAY'S REASON</span>
      <span style="font-size: 13.5px; font-weight: 600; color: #40415E;">Follow-up: recurring migraine, worse in the evenings</span>
    </div>

    <div style="background: #E9E7F0; border-radius: 22px; padding: 15px; box-shadow: inset 4px 4px 9px rgba(163,157,194,0.28), inset -4px -4px 9px rgba(255,255,255,0.75); display: flex; align-items: center; gap: 10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A2537C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      <span style="font-size: 13.5px; font-weight: 700; color: #A2537C;">Allergy: Sulfonamides</span>
    </div>

    <div style="background: #E9E7F0; border-radius: 22px; padding: 15px; box-shadow: 6px 6px 13px rgba(163,157,194,0.3), -6px -6px 13px rgba(255,255,255,0.85); display: flex; flex-direction: column; gap: 11px;">
      <span style="font-size: 14.5px; font-weight: 700; color: #40415E;">Allergies &amp; conditions</span>
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div><span style="font-size: 12.5px; color: #9C9CB0; font-weight: 600;">Allergies: </span><span style="font-size: 12.5px; color: #40415E;">Sulfonamides</span></div>
        <div><span style="font-size: 12.5px; color: #9C9CB0; font-weight: 600;">Chronic conditions: </span><span style="font-size: 12.5px; color: #40415E;">Migraine, hypothyroidism</span></div>
        <div><span style="font-size: 12.5px; color: #9C9CB0; font-weight: 600;">Current medications: </span><span style="font-size: 12.5px; color: #40415E;">Levothyroxine 50mcg</span></div>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <div style="width: 100%; padding: 17px; border-radius: 999px; background: #E9E7F0; box-shadow: 7px 7px 16px rgba(163,157,194,0.4), -7px -7px 16px rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A5F92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      <span style="color: #5A5F92; font-weight: 700; font-size: 15px;">Start Consultation</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
