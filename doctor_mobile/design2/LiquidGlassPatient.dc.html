<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    a { color: #5B7FFF; } a:hover { color: #3B5FE0; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: linear-gradient(160deg, #F6F4FC, #EEF0FC 55%, #E8ECFB); overflow: hidden;">

  <div style="position: absolute; top: -50px; right: -80px; width: 240px; height: 240px; border-radius: 999px; background: radial-gradient(circle, #B9CDFF, transparent 70%); filter: blur(14px); opacity: 0.85;"></div>
  <div style="position: absolute; top: 340px; left: -100px; width: 240px; height: 240px; border-radius: 999px; background: radial-gradient(circle, #E3C6FB, transparent 70%); filter: blur(16px); opacity: 0.7;"></div>
  <div style="position: absolute; bottom: 100px; right: -70px; width: 210px; height: 210px; border-radius: 999px; background: radial-gradient(circle, #FFC9E2, transparent 70%); filter: blur(14px); opacity: 0.7;"></div>

  <div style="position: relative; display: flex; flex-direction: column; height: 100%;">

    <div style="padding: 20px 16px 0; display: flex; align-items: center; gap: 14px;">
      <div style="width: 32px; height: 32px; border-radius: 999px; background: rgba(255,255,255,0.6); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </div>
      <span style="font-size: 17px; font-weight: 700; color: #22243F;">Patient snapshot</span>
    </div>

    <div style="flex: 1; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">

      <div style="padding: 16px; border-radius: 26px; background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.46)); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border: 1px solid rgba(255,255,255,0.65); box-shadow: 0 10px 30px rgba(90,80,170,0.14); display: flex; align-items: center; gap: 14px;">
        <div style="width: 56px; height: 56px; border-radius: 999px; background: linear-gradient(135deg, #5B7FFF, #9B6FE8); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 8px 18px rgba(91,127,255,0.35);">
          <span style="color: #FFFFFF; font-weight: 700; font-size: 18px;">MI</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 19px; font-weight: 700; color: #22243F; letter-spacing: -0.2px;">Meera Iyer</span>
          <div style="display: flex; gap: 6px;">
            <div style="padding: 3px 9px; border-radius: 999px; background: rgba(219,232,254,0.85);"><span style="font-size: 10.5px; font-weight: 700; color: #3B6FE0;">34F</span></div>
            <div style="padding: 3px 9px; border-radius: 999px; background: rgba(255,201,226,0.75);"><span style="font-size: 10.5px; font-weight: 700; color: #C23D75;">O+</span></div>
          </div>
        </div>
      </div>

      <div style="background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.42)); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.65); border-radius: 22px; padding: 14px; box-shadow: 0 8px 24px rgba(90,80,170,0.12); display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 10px; color: #9497B5; font-weight: 700; letter-spacing: 0.4px;">TODAY'S REASON</span>
        <span style="font-size: 13.5px; font-weight: 600; color: #22243F;">Follow-up: recurring migraine, worse in the evenings</span>
      </div>

      <div style="background: linear-gradient(180deg, rgba(255,220,236,0.75), rgba(255,201,226,0.5)); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.6); border-radius: 22px; padding: 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 22px rgba(224,73,138,0.16);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C23D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <span style="font-size: 13.5px; font-weight: 700; color: #C23D75;">Allergy: Sulfonamides</span>
      </div>

      <div style="background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.42)); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.65); border-radius: 22px; padding: 14px; box-shadow: 0 8px 24px rgba(90,80,170,0.12); display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 14.5px; font-weight: 700; color: #22243F;">Allergies &amp; conditions</span>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div><span style="font-size: 12.5px; color: #7A7F9E; font-weight: 600;">Allergies: </span><span style="font-size: 12.5px; color: #22243F;">Sulfonamides</span></div>
          <div><span style="font-size: 12.5px; color: #7A7F9E; font-weight: 600;">Chronic conditions: </span><span style="font-size: 12.5px; color: #22243F;">Migraine, hypothyroidism</span></div>
          <div><span style="font-size: 12.5px; color: #7A7F9E; font-weight: 600;">Current medications: </span><span style="font-size: 12.5px; color: #22243F;">Levothyroxine 50mcg</span></div>
        </div>
      </div>

      <div style="flex: 1;"></div>

      <div style="width: 100%; padding: 16px; border-radius: 999px; background: linear-gradient(135deg, #5B7FFF, #9B6FE8); box-shadow: 0 12px 28px rgba(91,127,255,0.4), inset 0 1px 2px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <span style="color: #FFFFFF; font-weight: 600; font-size: 15px;">Start Consultation</span>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
