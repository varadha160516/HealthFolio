<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    a { color: #4F63E0; } a:hover { color: #3548C4; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAFAFC; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 22px 18px 0; display: flex; align-items: center; gap: 12px;">
    <div style="width: 40px; height: 40px; border-radius: 14px; background: #4F63E0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <span style="color: #FFFFFF; font-weight: 800; font-size: 13px;">AR</span>
    </div>
    <div style="display: flex; flex-direction: column;">
      <span style="font-size: 12px; color: #9092A6; font-weight: 600;">Good day</span>
      <span style="font-size: 19px; color: #17182B; font-weight: 800; letter-spacing: -0.2px;">Dr. Ananya Rao</span>
    </div>
  </div>

  <div style="margin: 18px 18px 0; padding: 14px 18px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #E7E7EE; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#17182B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span style="font-weight: 800; font-size: 14px; letter-spacing: 0.3px; color: #17182B;">TUE, SEP 8</span>
    </div>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#17182B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </div>

  <div style="padding: 20px 18px 0; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 16px; font-weight: 800; color: #17182B;">Today's appointments</span>
    <span style="font-size: 13px; color: #9092A6; font-weight: 700;">3</span>
  </div>

  <div style="padding: 12px 18px 0; display: flex; gap: 8px; overflow: hidden;">
    <div style="padding: 8px 15px; border-radius: 10px; background: #4F63E0; flex-shrink: 0;"><span style="color: #FFFFFF; font-weight: 700; font-size: 12.5px;">All</span></div>
    <div style="padding: 8px 15px; border-radius: 10px; background: #FFFFFF; border: 1.5px solid #E7E7EE; flex-shrink: 0;"><span style="color: #17182B; font-weight: 700; font-size: 12.5px;">Upcoming</span></div>
    <div style="padding: 8px 15px; border-radius: 10px; background: #FFFFFF; border: 1.5px solid #E7E7EE; flex-shrink: 0;"><span style="color: #17182B; font-weight: 700; font-size: 12.5px;">Waiting</span></div>
  </div>

  <div style="flex: 1; padding: 16px 18px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">

    <div style="background: #FFD6E8; border: 1.5px solid #F5AFC9; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between;">
        <span style="font-size: 11.5px; font-weight: 800; color: #7A2F52; letter-spacing: 0.2px;">9:30 AM</span>
        <div style="padding: 3px 10px; border-radius: 8px; background: #FFFFFF;"><span style="font-size: 11px; font-weight: 800; color: #7A2F52;">WAITING</span></div>
      </div>
      <span style="font-size: 15px; font-weight: 800; color: #17182B;">Meera Iyer &middot; 34F</span>
      <span style="font-size: 12.5px; color: #7A2F52; font-weight: 600;">Follow-up: recurring migraine</span>
    </div>

    <div style="background: #CFF3E4; border: 1.5px solid #8FDFC0; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between;">
        <span style="font-size: 11.5px; font-weight: 800; color: #14684E; letter-spacing: 0.2px;">10:15 AM</span>
        <div style="padding: 3px 10px; border-radius: 8px; background: #FFFFFF;"><span style="font-size: 11px; font-weight: 800; color: #14684E;">READY</span></div>
      </div>
      <span style="font-size: 15px; font-weight: 800; color: #17182B;">Kabir Nair &middot; 8M</span>
      <span style="font-size: 12.5px; color: #14684E; font-weight: 600;">Fever and sore throat, 2 days</span>
    </div>

    <div style="background: #FFE3C2; border: 1.5px solid #F0BC7C; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between;">
        <span style="font-size: 11.5px; font-weight: 800; color: #8A5A1E; letter-spacing: 0.2px;">11:45 AM</span>
        <div style="padding: 3px 10px; border-radius: 8px; background: #FFFFFF;"><span style="font-size: 11px; font-weight: 800; color: #8A5A1E;">CHECKED IN</span></div>
      </div>
      <span style="font-size: 15px; font-weight: 800; color: #17182B;">Rohan Sharma &middot; 41M</span>
      <span style="font-size: 12.5px; color: #8A5A1E; font-weight: 600;">Annual checkup</span>
    </div>

  </div>

  <div style="padding: 12px 18px 22px; background: #FFFFFF; border-top: 1.5px solid #E7E7EE; display: flex; justify-content: space-around; align-items: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F63E0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span style="font-size: 10px; font-weight: 800; color: #4F63E0;">Home</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0B0C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span style="font-size: 10px; font-weight: 700; color: #B0B0C0;">Appts</span>
    </div>
    <div style="width: 50px; height: 50px; margin-top: -24px; border-radius: 16px; background: #4F63E0; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0B0C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
      <span style="font-size: 10px; font-weight: 700; color: #B0B0C0;">Patients</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0B0C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
      <span style="font-size: 10px; font-weight: 700; color: #B0B0C0;">More</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
