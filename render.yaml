services:
  - type: web
    name: careloop-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    # Free plan has no persistent disk -- CARELOOP_DB_PATH/CARELOOP_UPLOADS_DIR are left unset so
    # the app falls back to its own in-container relative paths (server/db.ts, routes/documents.ts),
    # which self-create on boot. That data does NOT survive a redeploy or a sleep/wake cycle (free
    # web services sleep after 15 min idle) -- the DB reseeds from scratch each time. Fine for a
    # demo/free deployment; move to a paid plan + disk if that stops being fine.
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PORT
        value: 4000
